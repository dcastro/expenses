package:
  name: expenses-manager
  dependencies:
    - aff
    - aff-promise
    - affjax
    - affjax-web
    - argonaut
    - argonaut-generic
    - arrays
    - b64
    - console
    - datetime
    - debug
    - effect
    - either
    - formatters
    - halogen
    - halogen-router
    - halogen-subscriptions
    - js-date
    - js-promise-aff
    - lists
    - maybe
    - newtype
    - now
    - ordered-collections
    - parsing
    - prelude
    - random
    - record
    - routing-duplex
    - strings
    - stringutils
    - tailrec
    - tuples
    - unsafe-coerce
    - untagged-union
    - validation
    - web-clipboard
    - web-events
    - web-html
    - web-storage
    - web-url
    - yoga-json

  test:
    main: Test.Main
    dependencies:
      - node-execa
      - nullable
      - spec
      - spec-discovery
    censorTestWarnings:
      - ImplicitImport
      - ImplicitQualifiedImport
      - ShadowedName
  build:
    censorProjectWarnings:
      - ImplicitImport
      - ImplicitQualifiedImport
      - ShadowedName

workspace:
  packageSet:
    registry: 66.3.0
  extraPackages:
    routing-duplex:
      git: https://github.com/dcastro/purescript-routing-duplex.git
      ref: a927dbb1589982ad5daf4a385cd73535eed99321
      dependencies:
        - arrays
        - assert
        - control
        - effect
        - either
        - foldable-traversable
        - integers
        - js-uri
        - lazy
        - maybe
        - newtype
        - prelude
        - profunctor
        - quickcheck
        - record
        - strings
        - tuples
    halogen-router:
      git: https://github.com/katsujukou/purescript-halogen-router.git
      ref: e25e7bbb7a32011c3f8c48c04612d5909455b035
      dependencies:
        - aff
        - effect
        - either
        - foreign
        - halogen
        - halogen-hooks
        - halogen-store
        - halogen-subscriptions
        - maybe
        - prelude
        - routing
        - routing-duplex
        - safe-coerce
        - transformers
        - tuples
