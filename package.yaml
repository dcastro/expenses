name: expenses
version: 0.1.0.0
#synopsis:
#description:
homepage: https://github.com/githubuser/expenses#readme
license: BSD3
author: Author name here
maintainer: example@example.com
copyright: 2022 Author name here
category: Web
extra-source-files:
  - README.md

default-extensions:
  - NoImplicitPrelude
  - AllowAmbiguousTypes
  - ApplicativeDo
  - BangPatterns
  - BlockArguments
  - ConstraintKinds
  - DataKinds
  - DefaultSignatures
  - DeriveAnyClass
  - DeriveDataTypeable
  - DeriveFoldable
  - DeriveFunctor
  - DeriveGeneric
  - DeriveTraversable
  - DerivingStrategies
  - DerivingVia
  - EmptyCase
  - FlexibleContexts
  - FlexibleInstances
  - FunctionalDependencies
  - GADTs
  - GeneralizedNewtypeDeriving
  - LambdaCase
  - MultiParamTypeClasses
  - MultiWayIf
  - NamedFieldPuns
  - NegativeLiterals
  - NumericUnderscores
  - NumDecimals
  - OverloadedLabels
  - OverloadedStrings
  - PatternSynonyms
  - PolyKinds
  - QuasiQuotes
  - QuantifiedConstraints
  - RankNTypes
  - RecordWildCards
  - RecursiveDo
  - ScopedTypeVariables
  - StandaloneDeriving
  - TemplateHaskell
  - TupleSections
  - TypeApplications
  - TypeFamilies
  - TypeOperators
  - UndecidableInstances
  - UndecidableSuperClasses
  - ViewPatterns
  - ImportQualifiedPost
  - StrictData
  - DuplicateRecordFields
  - OverloadedRecordDot
  - NoFieldSelectors
  - StandaloneKindSignatures
  - TypeAbstractions
  - LinearTypes
  - InstanceSigs

ghc-options:
  - -Weverything
  - -Wno-name-shadowing
  - -Wno-missing-exported-signatures
  - -Wno-missing-import-lists
  - -Wno-missing-export-lists
  - -Wno-missed-specialisations
  - -Wno-all-missed-specialisations
  - -Wno-unsafe
  - -Wno-safe
  - -Wno-missing-local-signatures
  - -Wno-monomorphism-restriction
  - -Wno-implicit-prelude
  - -Wno-prepositive-qualified-module
  - -Wno-missing-safe-haskell-mode
  - -Wno-missing-kind-signatures
  - -Wno-missing-role-annotations

executables:
  db-migrations:
    source-dirs: db-migrations
    main: Main.hs
    dependencies:
      - base
      - expenses
      - sqlite-simple
      - text
      - interpolate
  expenses-manager-server:
    source-dirs: server
    main: Main.hs
    dependencies:
      - base
      - expenses
    ghc-options:
      - -threaded

library:
  source-dirs: src
  dependencies:
    - base >= 4.7 && < 5
    - optparse-applicative
    - universum
    - lens >= 5.3.3 # this  is required so we can use `classIdFields`
    - aeson
    - aeson-casing
    - aeson-pretty
    - bytestring
    - time
    - http-client
    - http-client-tls
    - group-with
    - text
    - containers
    - unordered-containers
    - filepath
    - directory
    - fmt
    - sqlite-simple
    - uuid
    - interpolate
    - servant
    - servant-client
    - servant-auth
    - servant-auth-client
    - warp
    - servant-server
    - wai
    - wai-cors
    - wai-app-static
    - wai-extra
    - linear-base
    - http-types
    - log-base
    - template-haskell
    - mtl
    - cron
    - yaml
    - regex-tdfa
    - effectful
    - effectful-core
    - effectful-th
    - log-effectful
    - monad-time-effectful
    - sqlite-simple-effectful

tests:
  test:
    source-dirs: test
    main: Spec.hs
    dependencies:
      - base
      - expenses
      - sydtest

      - universum
      - servant-server
      - text
      - aeson
      - aeson-pretty
      - sqlite-simple-effectful
      - effectful
      - effectful-core
      - time
      - containers
      - monad-time-effectful
      - log-effectful
      - log-base
      - sqlite-simple
      - vector
      - lens
    ghc-options:
      - -Wno-x-partial
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N

build-tools:
  - sydtest-discover:sydtest-discover
