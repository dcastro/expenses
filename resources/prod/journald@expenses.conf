# Config for the `expenses` journal namespace.
# The `expenses-manager` service sends its logs to this namespace (see `LogNamespace=` in its unit file).
#
# The default journal on the Raspberry Pi is volatile (`Storage=volatile`, to reduce writes to the SD card),
# so it loses all logs on reboot.
# This namespace keeps the logs of the service on disk, at `/var/log/journal/<machine-id>.expenses/`.
#
# Read the logs with:
#   journalctl --namespace=expenses -u expenses-manager
#
# Docs:
# * https://www.freedesktop.org/software/systemd/man/latest/journald.conf.html
# * https://www.freedesktop.org/software/systemd/man/latest/systemd-journald.service.html#Journal%20Namespaces

[Journal]
Storage=persistent
SystemMaxUse=50M
